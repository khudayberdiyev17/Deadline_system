name: nis-assignment

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nis}
      POSTGRES_USER: ${POSTGRES_USER:-nis}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
  backend:
    build: ./backend
    env_file: .env
    ports: ["4444:8000"]
    volumes: [uploads:/data/uploads]
    depends_on:
      db: {condition: service_healthy}
  frontend:
    build: ./frontend
    ports: ["4422:80"]
    depends_on: [backend]
volumes:
  postgres_data:
  uploads:
